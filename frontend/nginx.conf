server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Aumentar los tiempos de espera
    proxy_connect_timeout 300;  # Tiempo máximo para conectar con el backend (en segundos)
    proxy_send_timeout 300;     # Tiempo máximo para enviar datos al backend (en segundos)
    proxy_read_timeout 300;     # Tiempo máximo para leer la respuesta del backend (en segundos)
  }
}