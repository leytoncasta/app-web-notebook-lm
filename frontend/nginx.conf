# ---- contexto http (fuera de server) ----
log_format upstream '$request -> $uri upstream=$upstream_addr [$upstream_status]';

server {
    listen 80;
    server_name _;              # cualquier hostname

    # ---- archivos estáticos Vite ----
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # ---- API ----
    location /api/ {
        # barra final ⇒ quita el prefijo /api/
        proxy_pass https://backend-service-697367184851.northamerica-south1.run.app/;

        # Host CORRECTO para Cloud Run  (o simplemente elimina la línea)
        proxy_set_header Host backend-service-697367184851.northamerica-south1.run.app;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_send_timeout    300;
        proxy_read_timeout    300;
    }

    access_log /dev/stdout upstream;
    error_log  /dev/stderr info;
}
