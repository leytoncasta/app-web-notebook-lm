services:


  # -----------------------------------------------------------------------------
  # Lógica Retriever (PostgreSQL Vectorial)
  # -----------------------------------------------------------------------------
  augment:
    
    image: us-central1-docker.pkg.dev/desarrollo-web-451923/cloud-images/aumentador:latest
    container_name: augment
    ports:
      - "2000:2000"
    depends_on:
      - retriever
    networks:
      - project_network
    volumes:
      - augment:/var/lib/augment/data
    restart: always

  # -----------------------------------------------------------------------------
  # Lógica Retriever (PostgreSQL Vectorial)
  # -----------------------------------------------------------------------------
  retriever:
    image: us-central1-docker.pkg.dev/desarrollo-web-451923/cloud-images/retriever
    container_name: retriever
    ports:
      - "8080:8080"
    #depends_on:
      #- vectorial_db
    networks:
      - project_network
    volumes:
      - retriever:/var/lib/retriever/data
    restart: always

# -----------------------------------------------------------------------------
# Chunking
# -----------------------------------------------------------------------------
  chunking:
    image: us-central1-docker.pkg.dev/desarrollo-web-451923/cloud-images/chunking:latest
    container_name: chunking_service
    ports:
      - "8001:8001"
    networks:
      - project_network

# -----------------------------------------------------------------------------
# Embeddings
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# 1
