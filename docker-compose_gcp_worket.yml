  embeddings1: 
    container_name: embeddings_service_1
    image: us-central1-docker.pkg.dev/desarrollo-web-451923/cloud-images/embeddings:latest
    ports:
      - "8002:8002"
    #depends_on:
      #- vectorial_db
    networks:
      - project_network

